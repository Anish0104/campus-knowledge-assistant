services:
  margin:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:3b}"
      OLLAMA_TIMEOUT_SECONDS: "${OLLAMA_TIMEOUT_SECONDS:-120}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-openai/gpt-oss-20b}"
      GROQ_TIMEOUT_SECONDS: "${GROQ_TIMEOUT_SECONDS:-60}"
      GROQ_MAX_COMPLETION_TOKENS: "${GROQ_MAX_COMPLETION_TOKENS:-2048}"
      HF_HOME: "/app/.cache/huggingface"

    volumes:
      - huggingface-cache:/app/.cache/huggingface

    init: true

volumes:
  huggingface-cache:

